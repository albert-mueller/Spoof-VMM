name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      lilu_tag:
        description: 'Lilu version to build against (empty = latest release)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.config }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: Release
            suffix: RELEASE
          - config: Debug
            suffix: DEBUG
    steps:
      - uses: actions/checkout@v4

      - name: Check version consistency
        id: ver
        run: |
          VERSION=$(sed -n 's/^VERSION[[:space:]]*:=[[:space:]]*//p' Makefile | tr -d '[:space:]')
          PLIST_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)
          if [ "$VERSION" != "$PLIST_VERSION" ]; then
            echo "::error::Makefile VERSION ($VERSION) does not match Info.plist ($PLIST_VERSION)"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Fetch Lilu SDK and MacKernelSDK
        env:
          TAG: ${{ inputs.lilu_tag }}
        run: bash ./bootstrap.sh

      - name: Build
        run: |
          make clean
          make CONFIG=${{ matrix.config }}

      - name: Verify binary
        run: |
          KEXT=build/${{ matrix.config }}/SpoofVMM.kext
          plutil -lint "$KEXT/Contents/Info.plist"
          file "$KEXT/Contents/MacOS/SpoofVMM"
          file "$KEXT/Contents/MacOS/SpoofVMM" | grep -q 'kext bundle x86_64' \
            || { echo "::error::Binary is not an x86_64 kext bundle"; exit 1; }

      - name: Package
        id: pkg
        run: |
          ZIP="SpoofVMM-${{ steps.ver.outputs.version }}-${{ matrix.suffix }}.zip"
          cd build/${{ matrix.config }}
          dsymutil SpoofVMM.kext/Contents/MacOS/SpoofVMM -o SpoofVMM.kext.dSYM
          zip -qry "$GITHUB_WORKSPACE/$ZIP" SpoofVMM.kext SpoofVMM.kext.dSYM
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: SpoofVMM-${{ matrix.suffix }}
          path: ${{ steps.pkg.outputs.zip }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title "SpoofVMM $GITHUB_REF_NAME" \
              --generate-notes
          fi
